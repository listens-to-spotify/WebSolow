server {
    listen 80;
    listen [::]:80;
    server_name crazy-barbarian.org www.crazy-barbarian.org;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crazy-barbarian.org www.crazy-barbarian.org;

    ssl_certificate /etc/letsencrypt/live/crazy-barbarian.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crazy-barbarian.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    location /WebSolow {
        alias /usr/share/nginx/html/WebSolow;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|svg|html)$ {
        expires 2d;
        add_header Cache-Control "public, immutable";
    }
}
